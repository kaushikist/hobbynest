<div style="max-width:560px;margin:0 auto;padding:28px 18px;font-family:Arial,Helvetica,sans-serif;color:#182235">
  <div style="font-size:22px;font-weight:700;color:#1558c0;margin-bottom:18px">Hobby<span style="color:#e65b9b">Nest</span></div>
  <div style="background:#ffffff;border:1px solid #e3e8f0;border-radius:12px;padding:26px">
    <h1 style="font-size:20px;margin:0 0 12px">Confirm your email to finish registering</h1>
    <p style="font-size:14px;line-height:1.6;margin:0 0 12px">Thanks for signing up to HobbyNest with <strong>{{ .Email }}</strong>. Click the button below to verify your email and complete your registration.</p>
    <p style="margin:26px 0">
      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
         style="background:#1558c0;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:700;display:inline-block">Confirm my email</a>
    </p>
    <p style="font-size:12px;color:#6b7686;line-height:1.6;margin:0">This link works once. If you didn't create a HobbyNest account, you can ignore this email.</p>
  </div>
</div>
