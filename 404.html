<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | HobbyNest</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; color: #182235; background: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
  .logo { font-size: 26px; font-weight: 700; color: #1558c0; margin-bottom: 28px; }
  .logo span { color: #e65b9b; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 34px; margin: 0 0 10px; }
  p { color: #7d8796; margin: 0 0 26px; }
  a.btn { display: inline-block; background: #1558c0; color: #fff; padding: 12px 20px; font-weight: 700; font-size: 13px; text-decoration: none; }
</style>
  <script>
    // Supabase sends people to the Site URL when a redirect address isn't on its
    // allow-list. Keep any verification / reset tokens and send them to the right page.
    (function () {
      var h = location.hash, q = location.search, base = "/src/screens/auth/";
      if (/type=recovery/.test(h + q)) { location.replace(base + "reset-password.html" + q + h); return; }
      if (/(^#|&)(access_token|error_description|error_code)=/.test(h) || /[?&](code|token_hash|error_description)=/.test(q)) {
        location.replace(base + "verify.html" + q + h); return;
      }
      
    })();
  </script>
</head>
<body>
  <main>
    <div class="logo">Hobby<span>Nest</span></div>
    <h1>This page doesn't exist</h1>
    <p>The link may be old or mistyped.</p>
    <a class="btn" href="/src/screens/auth/login.html">Go to HobbyNest →</a>
  </main>
</body>
</html>
